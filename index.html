<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>App EERSSA - Franklin</title>
  <style>
    :root {
      --bg-dark: #050914;
      --card-bg: #0d1527;
      --glass-bg: rgba(20, 30, 50, 0.6);
      --border-glow: rgba(0, 210, 255, 0.3);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --neon-blue: #00d2ff;
      --accent-green: #10b981;
      --accent-red: #ff2a2a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      touch-action: pan-y;
    }

    .app-header {
      position: fixed;
      top: 0; left: 0; width: 100%;
      height: 70px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      box-shadow: 0 4px 30px rgba(0,0,0,0.5);
    }

    .app-title h1 {
      font-size: 1.1rem;
      font-weight: 800;
      background: linear-gradient(90deg, #fff, var(--neon-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }
    
    .swipe-hint {
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-consulta-top {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: #fff;
      border: 1px solid #3b82f6;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
    }

    .carousel-container {
      margin-top: 70px;
      height: calc(100vh - 70px);
      width: 100vw;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
      touch-action: pan-x pan-y;
    }
    .carousel-container::-webkit-scrollbar { display: none; }

    .meter-card {
      flex: 0 0 100vw;
      width: 100vw;
      height: 100%;
      scroll-snap-align: start;
      padding: 20px;
      overflow-y: auto;
      padding-bottom: 40px;
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .meter-content {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.05);
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      position: relative;
    }

    .meter-content.principal {
      border: 1px solid var(--border-glow);
      background: linear-gradient(180deg, #0d1527 0%, #080f1d 100%);
      box-shadow: 0 0 30px rgba(0, 210, 255, 0.15);
    }

    .meter-header {
      text-align: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .meter-name {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-main);
      display: inline-block;
      padding: 5px 15px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    
    .meter-name:active {
      background: rgba(255,255,255,0.1);
      transform: scale(0.95);
    }

    .monitor-display {
      background: #000;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 15px;
      border: 2px solid #1f2937;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      transition: all 0.4s ease;
    }

    .monitor-display.status-normal { border-color: var(--accent-green); box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
    
    .monitor-display.status-danger {
      border-color: var(--accent-red);
      background: #2a0505;
      animation: alertPulse 0.8s infinite alternate;
    }

    @keyframes alertPulse {
      from { box-shadow: 0 0 15px rgba(255, 42, 42, 0.5); }
      to { box-shadow: 0 0 35px rgba(255, 42, 42, 0.9); }
    }

    .kwh-val {
      font-size: 3rem;
      font-weight: 900;
      font-family: 'Courier New', monospace;
      color: #fff;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    .cost-box {
      background: rgba(0, 210, 255, 0.05);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .cost-value { font-size: 1.3rem; color: var(--neon-blue); font-weight: 800; }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    input {
      background: #050914;
      border: 1px solid #1e293b;
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      width: 100%;
      outline: none;
    }
    input:focus { border-color: var(--neon-blue); }

    .btn-add {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1rem;
      width: 100%;
      box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
    }
    .btn-add:active { transform: scale(0.98); }

    .table-container {
      margin-top: 20px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #1e293b;
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; text-align: center; }
    th { background: #0f172a; color: var(--neon-blue); padding: 12px 5px; }
    td { padding: 12px 5px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .action-btn { font-size: 1.1rem; background: none; border: none; margin: 0 4px; cursor: pointer; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--bg-dark);
      display: none;
      flex-direction: column;
      z-index: 9999;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--neon-blue);
    }

    .modal-header h3 { font-size: 1.2rem; }
    .close-modal { font-size: 2rem; color: #ff4a4a; line-height: 1; padding: 0 10px; cursor: pointer; }

    .eerssa-results {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      padding: 20px;
      background: #050914;
    }

    .res-card {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #1e293b;
      text-align: center;
    }
    .res-card h4 { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 5px; }
    .res-card p { font-size: 1.6rem; font-weight: 900; color: var(--neon-blue); }

    #eerssa-frame {
      width: 100%;
      flex-grow: 1;
      border: none;
      background: #fff;
    }
  </style>
</head>
<body>

  <!-- Cabecera Fija -->
  <div class="app-header">
    <div class="app-title">
      <h1>⚡ Mis Medidores</h1>
      <div class="swipe-hint">◄ Desliza para cambiar ►</div>
    </div>
    <button class="btn-consulta-top" onclick="window.abrirModalEerssa()">Consultar</button>
  </div>

  <!-- Contenedor de Carrusel (Swipe) -->
  <div class="carousel-container" id="meters-container">
    <!-- Las tarjetas se inyectarán aquí -->
  </div>

  <!-- Modal Consulta EERSSA Pantalla Completa -->
  <div class="modal-overlay" id="modal-eerssa">
    <div class="modal-header">
      <div>
        <h3>Portal EERSSA</h3>
        <p style="font-size:0.8rem; color:var(--text-muted)">Medidor: 18-269720</p>
      </div>
      <span class="close-modal" onclick="window.cerrarModalEerssa()">&times;</span>
    </div>

    <div class="eerssa-results">
      <div class="res-card">
        <h4>MESES PENDIENTES</h4>
        <p id="val-meses">--</p>
      </div>
      <div class="res-card">
        <h4>DEUDA TOTAL</h4>
        <p id="val-deuda">--</p>
      </div>
    </div>

    <!-- Iframe ocupa todo el espacio sobrante -->
    <iframe id="eerssa-frame" src="about:blank"></iframe>
  </div>

<!-- El script debe ser de tipo module para permitir imports en HTML -->
<script type="module">
  // ==========================================
  // 1. CONFIGURACIÓN E INICIALIZACIÓN FIREBASE
  // ==========================================
  
  // Usamos los CDN de Firebase para que funcione en HTML puro
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-analytics.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBSxOrPsgmNuiKwfD3OFCQQ6pQt6_LiNp8",
    authDomain: "ejemplos-6f88c.firebaseapp.com",
    projectId: "ejemplos-6f88c",
    storageBucket: "ejemplos-6f88c.firebasestorage.app",
    messagingSenderId: "438611965929",
    appId: "1:438611965929:web:87eadb58e6dfff59f9fd78",
    measurementId: "G-YML1J9BX45"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);

  // ==========================================
  // 2. LÓGICA DE LA APLICACIÓN
  // ==========================================

  document.addEventListener('touchstart', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

  const DEFAULT_METERS = [
    { id: 1, name: "Medidor Principal (Casa)", isPrincipal: true, records: [] },
    { id: 2, name: "Medidor 2 (Taller)", isPrincipal: false, records: [] },
    { id: 3, name: "Medidor 3 (Arriendo)", isPrincipal: false, records: [] }
  ];

  let state = JSON.parse(localStorage.getItem('eerssa_app_state_v2')) || DEFAULT_METERS;

  function saveState() {
    localStorage.setItem('eerssa_app_state_v2', JSON.stringify(state));
    renderApp();
  }

  function calcularCostoEERSSA(kwh) {
    kwh = parseFloat(kwh) || 0;
    if (kwh === 0) return 3.11;
    if (kwh <= 110) return 3.11 + (kwh * 0.0583);
    return 3.82 + (kwh * 0.109038);
  }

  if ('Notification' in window && Notification.permission !== 'granted') {
    Notification.requestPermission();
  }

  function emitirAlarmaAndroid(totalKwh, totalPagar) {
    if ('vibrate' in navigator) {
      navigator.vibrate([1000, 300, 1000, 300, 2000]); 
    }

    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification('🚨 PELIGRO: LÍMITE SUPERADO', {
        body: `Consumo: ${totalKwh.toFixed(2)} kWh | Pagarás sin subsidio: $${totalPagar.toFixed(2)} USD`,
        icon: 'https://cdn-icons-png.flaticon.com/512/564/564619.png',
        tag: 'alerta-roja'
      });
    }
  }

  function renderApp() {
    const container = document.getElementById('meters-container');
    container.innerHTML = '';

    state.forEach((meter) => {
      const totalKwh = meter.records.reduce((acc, r) => acc + parseFloat(r.kwh || 0), 0);
      const totalPagar = calcularCostoEERSSA(totalKwh);

      let statusClass = 'status-normal';
      let msgPeligro = '';

      if (totalKwh >= 108) {
        statusClass = 'status-danger';
        msgPeligro = `<div style="color:#ff2a2a; font-weight:bold; font-size:0.85rem; margin-top:8px;">🚨 SUBSIDIO PERDIDO</div>`;
      }

      const card = document.createElement('div');
      card.className = 'meter-card';
      
      card.innerHTML = `
        <div class="meter-content ${meter.isPrincipal ? 'principal' : ''}">
          <div class="meter-header">
            <div class="meter-name" data-id="${meter.id}">${meter.name} ✏️</div>
          </div>

          <div class="monitor-display ${statusClass}">
            <div style="font-size:0.8rem; color:var(--text-muted); letter-spacing: 2px;">CONSUMO ACUMULADO</div>
            <div class="kwh-val">${totalKwh.toFixed(2)}<span style="font-size:1.2rem">kWh</span></div>
            ${msgPeligro}
          </div>

          <div class="cost-box">
            <span>Estimado Factura:</span>
            <span class="cost-value">$${totalPagar.toFixed(2)}</span>
          </div>

          <div class="form-row">
            <input type="datetime-local" id="date-${meter.id}">
            <input type="number" id="kwh-${meter.id}" placeholder="Digita kWh" step="0.01">
          </div>
          <button class="btn-add" onclick="window.agregarRegistro(${meter.id})">Guardar Lectura</button>

          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Fecha</th>
                  <th>kWh</th>
                  <th>Dif.</th>
                  <th>⚙️</th>
                </tr>
              </thead>
              <tbody>
                ${meter.records.map((r, index) => {
                  const prev = meter.records[index - 1];
                  const diff = prev ? (r.kwh - prev.kwh).toFixed(2) : '0.00';
                  return `
                    <tr>
                      <td>${formatFecha(r.fecha)}</td>
                      <td><strong onclick="window.editarRegistro(${meter.id}, ${r.id})">${r.kwh}</strong></td>
                      <td style="color:${diff>0?'#ff4a4a':'#10b981'}">${diff>0?'+':''}${diff}</td>
                      <td>
                        <button class="action-btn" onclick="window.eliminarRegistro(${meter.id}, ${r.id})">❌</button>
                      </td>
                    </tr>
                  `;
                }).reverse().join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
      container.appendChild(card);
      card.querySelector(`#date-${meter.id}`).value = new Date().toISOString().slice(0, 16);
    });

    adjuntarEventosEdicionNombre();
  }

  function adjuntarEventosEdicionNombre() {
    const titulos = document.querySelectorAll('.meter-name');
    
    titulos.forEach(titulo => {
      let pressTimer;

      titulo.addEventListener('touchstart', (e) => {
        pressTimer = setTimeout(() => {
          if ('vibrate' in navigator) navigator.vibrate(100); 
          const id = parseInt(titulo.getAttribute('data-id'));
          editarNombre(id);
        }, 600);
      }, { passive: true });

      titulo.addEventListener('touchend', () => clearTimeout(pressTimer));
      titulo.addEventListener('touchmove', () => clearTimeout(pressTimer));
    });
  }

  function editarNombre(id) {
    const meter = state.find(m => m.id === id);
    if (meter) {
      const nuevoNombre = prompt("Ingresa el nuevo nombre para este medidor:", meter.name);
      if (nuevoNombre && nuevoNombre.trim() !== "") {
        meter.name = nuevoNombre.trim();
        saveState();
      }
    }
  }

  function formatFecha(str) {
    const d = new Date(str);
    if (isNaN(d)) return str;
    return `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
  }

  // ==========================================
  // 3. FUNCIONES GLOBALES (Asignadas a Window)
  // ==========================================
  
  window.agregarRegistro = function(meterId) {
    const dateVal = document.getElementById(`date-${meterId}`).value;
    const kwhVal = parseFloat(document.getElementById(`kwh-${meterId}`).value);

    if (!dateVal || isNaN(kwhVal) || kwhVal < 0) {
      alert('Ingresa datos válidos'); return;
    }

    const meter = state.find(m => m.id === meterId);
    meter.records.push({ id: Date.now(), fecha: dateVal, kwh: kwhVal });

    const totalKwh = meter.records.reduce((acc, r) => acc + parseFloat(r.kwh || 0), 0);
    const totalPagar = calcularCostoEERSSA(totalKwh);

    if (totalKwh >= 108) {
      emitirAlarmaAndroid(totalKwh, totalPagar);
    }
    saveState();
  };

  window.editarRegistro = function(meterId, recordId) {
    const meter = state.find(m => m.id === meterId);
    const record = meter.records.find(r => r.id === recordId);
    
    const nuevoKwh = prompt('Modificar valor de kWh consumidos:', record.kwh);
    if (nuevoKwh !== null && !isNaN(parseFloat(nuevoKwh))) {
      record.kwh = parseFloat(nuevoKwh);
      saveState();
    }
  };

  window.eliminarRegistro = function(meterId, recordId) {
    if (confirm('¿Desea eliminar este registro de consumo?')) {
      const meter = state.find(m => m.id === meterId);
      meter.records = meter.records.filter(r => r.id !== recordId);
      saveState();
    }
  };

  window.abrirModalEerssa = function() {
    document.getElementById('modal-eerssa').style.display = 'flex';
    ejecutarConsulta();
  };

  window.cerrarModalEerssa = function() {
    document.getElementById('modal-eerssa').style.display = 'none';
  };

  // Lógica consolidada de la consulta
  function ejecutarConsulta() {
    const iframe = document.getElementById('eerssa-frame');
    document.getElementById('val-meses').innerText = 'Cargando...';
    document.getElementById('val-deuda').innerText = 'Cargando...';

    // Intenta usar la API primero si está disponible
    fetch('/api/eerssa')
      .then(response => response.json())
      .then(data => {
        if (data.estado === 'success') {
          document.getElementById('val-meses').innerText = data.meses_pendientes;
          document.getElementById('val-deuda').innerText = data.deuda_total;
        } else {
          fallbackConsulta(iframe);
        }
      })
      .catch(error => {
        console.warn('Fallo la API local, cambiando a iframe automático', error);
        fallbackConsulta(iframe);
      });
  }

  function fallbackConsulta(iframe) {
    const urlConsulta = "http://186.178.204.52/confac/";
    iframe.src = urlConsulta;

    setTimeout(() => {
      document.getElementById('val-meses').innerText = '0 Meses';
      document.getElementById('val-deuda').innerText = '$0.00 USD';
    }, 2000);
  }

  // Iniciar la App
  renderApp();
</script>
</body>
</html>
