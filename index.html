<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>App EERSSA - Franklin</title>
  <style>
    :root {
      --bg-dark: #050914;
      --card-bg: #0d1527;
      --glass-bg: rgba(20, 30, 50, 0.6);
      --border-glow: rgba(0, 210, 255, 0.3);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --neon-blue: #00d2ff;
      --accent-green: #10b981;
      --accent-red: #ff2a2a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      touch-action: pan-x pan-y;
    }

    /* --- CABECERA FIJA Y WIDGETS --- */
    .app-header {
      position: fixed;
      top: 0; left: 0; width: 100%;
      height: auto;
      min-height: 80px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      padding: 10px 15px;
      z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      box-shadow: 0 4px 30px rgba(0,0,0,0.5);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 8px;
    }

    .app-title h1 {
      font-size: 1.1rem;
      font-weight: 800;
      background: linear-gradient(90deg, #fff, var(--neon-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }
    
    .swipe-hint {
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-consulta-top {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: #fff;
      border: 1px solid #3b82f6;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
      cursor: pointer;
    }

    /* --- TARJETAS DE ESTADO SUPERIOR --- */
    .eerssa-inline-widgets {
      display: flex;
      gap: 10px;
      justify-content: flex-start;
      align-items: center;
      width: 100%;
    }

    .mini-res-card {
      background: rgba(5, 9, 20, 0.8);
      border: 1px solid rgba(0, 210, 255, 0.25);
      padding: 6px 12px;
      border-radius: 10px;
      min-width: 120px;
      box-shadow: inset 0 0 10px rgba(0, 210, 255, 0.05);
      transition: all 0.3s;
    }

    .mini-res-card h4 {
      font-size: 0.58rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .mini-res-card p {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--neon-blue);
      text-shadow: 0 0 8px rgba(0, 210, 255, 0.5);
    }

    .updating {
      opacity: 0.5;
      animation: pulseGlow 1.5s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { border-color: rgba(0, 210, 255, 0.2); box-shadow: 0 0 5px rgba(0, 210, 255, 0.1); }
      100% { border-color: rgba(0, 210, 255, 0.8); box-shadow: 0 0 15px rgba(0, 210, 255, 0.4); }
    }

    /* --- CARRUSEL --- */
    .carousel-container {
      margin-top: 115px;
      width: 100%;
      height: calc(100vh - 115px);
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
      touch-action: pan-x pan-y;
    }
    .carousel-container::-webkit-scrollbar { display: none; }

    /* --- TARJETAS DE MEDIDOR --- */
    .meter-card {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      padding: 15px;
      overflow-y: auto;
      padding-bottom: 80px;
    }

    .meter-content {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 18px;
      border: 1px solid rgba(255,255,255,0.05);
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      position: relative;
    }

    .meter-content.principal {
      border: 1px solid var(--border-glow);
      background: linear-gradient(180deg, #0d1527 0%, #080f1d 100%);
      box-shadow: 0 0 25px rgba(0, 210, 255, 0.12);
    }

    .meter-header {
      text-align: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .meter-name {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-main);
      display: inline-block;
      padding: 4px 12px;
      border-radius: 8px;
      font-style: italic;
    }

    /* --- MONITOR DE CONSUMO --- */
    .monitor-display {
      background: #000;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      margin-bottom: 15px;
      border: 2px solid #1f2937;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      transition: all 0.4s ease;
    }

    .monitor-display.status-normal { border-color: var(--accent-green); box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
    
    .monitor-display.status-danger {
      border-color: var(--accent-red);
      background: #2a0505;
      animation: alertPulse 0.8s infinite alternate;
    }

    @keyframes alertPulse {
      from { box-shadow: 0 0 15px rgba(255, 42, 42, 0.5); }
      to { box-shadow: 0 0 35px rgba(255, 42, 42, 0.9); }
    }

    .kwh-val {
      font-size: 2.8rem;
      font-weight: 900;
      font-family: 'Courier New', monospace;
      color: #fff;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    .cost-box {
      background: rgba(0, 210, 255, 0.05);
      border-radius: 12px;
      padding: 12px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 15px;
    }
    .cost-value { font-size: 1.2rem; color: var(--neon-blue); font-weight: 800; }

    /* --- FORMULARIO Y TABLA --- */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    input {
      background: #050914;
      border: 1px solid #1e293b;
      color: #fff;
      padding: 12px 10px;
      border-radius: 10px;
      font-size: 0.85rem;
      width: 100%;
      outline: none;
    }
    input:focus { border-color: var(--accent-green); }

    .btn-add {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1rem;
      width: 100%;
      box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
      cursor: pointer;
    }
    .btn-add:active { transform: scale(0.98); }

    .table-container {
      margin-top: 15px;
      border-radius: 12px;
      overflow-x: auto;
      border: 1px solid #1e293b;
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; text-align: center; }
    th { background: #0f172a; color: var(--neon-blue); padding: 12px 5px; }
    td { padding: 12px 5px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .action-btn { font-size: 1rem; background: none; border: none; margin: 0 3px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="app-header">
    <div class="header-top">
      <div class="app-title">
        <h1>⚡ Mis Medidores</h1>
      </div>
      <button class="btn-consulta-top" onclick="ejecutarConsultaEerssa()">
        <span>🔄</span> Consultar
      </button>
    </div>
    <div class="swipe-hint">◄ Desliza para cambiar de medidor ►</div>

    <div class="eerssa-inline-widgets">
      <div class="mini-res-card" id="card-meses">
        <h4>MESES PENDIENTES</h4>
        <p id="val-meses">--</p>
      </div>
      <div class="mini-res-card" id="card-deuda">
        <h4>DEUDA TOTAL</h4>
        <p id="val-deuda">--</p>
      </div>
    </div>
  </div>

  <div class="carousel-container" id="meters-container"></div>

<script>
  // Evitar zoom multitáctil
  document.addEventListener('touchstart', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

  // Configuración Maestra con tus 3 medidores reales
  const DEFAULT_METERS = [
    { id: 1, name: "Principal (Casa)", isPrincipal: true, records: [], numero: "18-269720" },
    { id: 2, name: "Medidor 2 (Taller)", isPrincipal: false, records: [], numero: "18-269719" },
    { id: 3, name: "Medidor 3 (Arriendo)", isPrincipal: false, records: [], numero: "18-269718" }
  ];

  let state = [];

  try {
    const localData = JSON.parse(localStorage.getItem('eerssa_app_state_v2'));
    if (Array.isArray(localData) && localData.length > 0) {
      state = localData.map((m, index) => {
        const def = DEFAULT_METERS.find(d => d.id === m.id) || DEFAULT_METERS[index] || DEFAULT_METERS[0];
        return {
          id: m.id || def.id,
          name: m.name || def.name,
          isPrincipal: m.isPrincipal !== undefined ? m.isPrincipal : def.isPrincipal,
          records: Array.isArray(m.records) ? m.records : [],
          numero: def.numero 
        };
      });
    } else {
      state = JSON.parse(JSON.stringify(DEFAULT_METERS));
    }
  } catch(e) {
    state = JSON.parse(JSON.stringify(DEFAULT_METERS));
  }

  let activeMeterId = 1;
  let meterObserver = null;
  let currentMeterIndex = 0;
  let scrapingActive = false;

  function saveState() {
    localStorage.setItem('eerssa_app_state_v2', JSON.stringify(state));
    renderApp();
  }

  function calcularCostoEERSSA(kwh) {
    kwh = parseFloat(kwh) || 0;
    if (kwh === 0) return 3.11;
    if (kwh <= 110) return 3.11 + (kwh * 0.0583);
    return 3.82 + (kwh * 0.109038);
  }

  function renderApp() {
    const container = document.getElementById('meters-container');
    container.innerHTML = '';

    state.forEach((meter) => {
      const totalKwh = meter.records.reduce((acc, r) => acc + parseFloat(r.kwh || 0), 0);
      const totalPagar = calcularCostoEERSSA(totalKwh);

      let statusClass = 'status-normal';
      let msgPeligro = '';

      if (totalKwh >= 108) {
        statusClass = 'status-danger';
        msgPeligro = `<div style="color:#ff2a2a; font-weight:bold; font-size:0.85rem; margin-top:8px;">🚨 SUBSIDIO PERDIDO</div>`;
      }

      const card = document.createElement('div');
      card.className = 'meter-card';
      card.setAttribute('data-meter-id', meter.id); 
      
      card.innerHTML = `
        <div class="meter-content ${meter.isPrincipal ? 'principal' : ''}">
          <div class="meter-header">
            <div class="meter-name" data-id="${meter.id}">${meter.name}</div>
            <div style="color: var(--text-muted); font-size: 0.75rem; margin-top: 5px;">Cod: ${meter.numero}</div>
          </div>

          <div class="monitor-display ${statusClass}">
            <div style="font-size:0.8rem; color:var(--text-muted); letter-spacing: 2px;">CONSUMO ACUMULADO</div>
            <div class="kwh-val">${totalKwh.toFixed(2)}<span style="font-size:1.2rem">kWh</span></div>
            ${msgPeligro}
          </div>

          <div class="cost-box">
            <span>Estimado Factura:</span>
            <span class="cost-value">$${totalPagar.toFixed(2)}</span>
          </div>

          <div class="form-row">
            <input type="datetime-local" id="date-${meter.id}">
            <input type="number" id="kwh-${meter.id}" placeholder="Digita kWh" step="0.01">
          </div>
          <button class="btn-add" onclick="agregarRegistro(${meter.id})">Guardar Lectura</button>

          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Fecha</th>
                  <th>kWh</th>
                  <th>Dif.</th>
                  <th>⚙️</th>
                </tr>
              </thead>
              <tbody>
                ${meter.records.slice().reverse().map((r, index, arr) => {
                  const originalIndex = arr.length - 1 - index;
                  const prev = meter.records[originalIndex - 1];
                  const diff = prev ? (r.kwh - prev.kwh).toFixed(2) : '0.00';
                  return `
                    <tr>
                      <td>${formatFecha(r.fecha)}</td>
                      <td><strong>${r.kwh}</strong></td>
                      <td style="color:${diff>0?'#ff4a4a':'#10b981'}">${diff>0?'+':''}${diff}</td>
                      <td>
                        <button class="action-btn" onclick="editarRegistro(${meter.id}, ${r.id})">✏️</button>
                        <button class="action-btn" onclick="eliminarRegistro(${meter.id}, ${r.id})">❌</button>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
      container.appendChild(card);
      
      try {
         const dateInput = card.querySelector(`#date-${meter.id}`);
         if(dateInput) {
             const now = new Date();
             now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
             dateInput.value = now.toISOString().slice(0, 16);
         }
      } catch(e) {}
    });

    initObserver();
  }

  function initObserver() {
    if (meterObserver) meterObserver.disconnect();
    meterObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          activeMeterId = parseInt(entry.target.getAttribute('data-meter-id'));
          actualizarHeaderUI(); 
        }
      });
    }, { root: document.querySelector('.carousel-container'), threshold: 0.6 });

    document.querySelectorAll('.meter-card').forEach(card => {
      meterObserver.observe(card);
    });
  }

  function formatFecha(str) {
    const d = new Date(str);
    if (isNaN(d)) return str;
    return `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
  }

  function agregarRegistro(meterId) {
    const dateVal = document.getElementById(`date-${meterId}`).value;
    const kwhVal = parseFloat(document.getElementById(`kwh-${meterId}`).value);

    if (!dateVal || isNaN(kwhVal) || kwhVal < 0) { alert('Ingresa datos válidos'); return; }

    const meter = state.find(m => m.id === meterId);
    meter.records.push({ id: Date.now(), fecha: dateVal, kwh: kwhVal });
    saveState();
  }

  function editarRegistro(meterId, recordId) {
    const meter = state.find(m => m.id === meterId);
    const record = meter.records.find(r => r.id === recordId);
    const nuevoKwh = prompt('Modificar valor de kWh consumidos:', record.kwh);
    if (nuevoKwh !== null && !isNaN(parseFloat(nuevoKwh))) {
      record.kwh = parseFloat(nuevoKwh);
      saveState();
    }
  }

  function eliminarRegistro(meterId, recordId) {
    if (confirm('¿Desea eliminar este registro?')) {
      const meter = state.find(m => m.id === meterId);
      meter.records = meter.records.filter(r => r.id !== recordId);
      saveState();
    }
  }

  /* ==============================================================
     NUEVO MOTOR DE CONSULTA CON SISTEMA DE DOBLE PROXY
  ============================================================== */
  function ejecutarConsultaEerssa() {
    if(scrapingActive) return; 
    scrapingActive = true;
    currentMeterIndex = 0;
    
    state.forEach(m => {
        m.deuda = "En cola...";
        m.meses = "--";
        m.isFetching = true; 
    });
    actualizarHeaderUI();
    
    procesarSiguienteMedidorAsync();
  }

  async function procesarSiguienteMedidorAsync() {
    if (currentMeterIndex >= state.length) {
      scrapingActive = false;
      actualizarHeaderUI();
      return;
    }

    const meter = state[currentMeterIndex];
    meter.deuda = "Buscando...";
    meter.meses = "Buscando...";
    actualizarHeaderUI();

    const targetUrl = 'http://186.178.204.52/confac/';
    
    const formParams = new URLSearchParams();
    formParams.append('criterio', 'MED'); 
    formParams.append('valor', meter.numero);

    let htmlText = "";
    let errorCritico = false;

    try {
      // PLAN A: Usar ThingProxy (Suele permitir HTTP sin problemas)
      const res1 = await fetch('https://thingproxy.freeboard.io/fetch/' + targetUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formParams.toString()
      });
      if (!res1.ok) throw new Error("ThingProxy denegó la conexión");
      htmlText = await res1.text();

    } catch (err1) {
      console.warn("Proxy 1 falló, intentando Proxy 2...", err1);
      
      try {
        // PLAN B: Usar CodeTabs como respaldo
        const res2 = await fetch('https://api.codetabs.com/v1/proxy/?quest=' + targetUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formParams.toString()
        });
        if (!res2.ok) throw new Error("CodeTabs también denegó la conexión");
        htmlText = await res2.text();

      } catch (err2) {
        console.error("Ambos proxies fallaron:", err2);
        errorCritico = true;
        meter.deuda = "Error (Proxies caídos)";
        meter.meses = "--";
      }
    }

    // Si logró extraer el HTML con alguno de los dos proxies, procesamos los datos
    if (!errorCritico && htmlText) {
        try {
          const parser = new DOMParser();
          const doc = parser.parseFromString(htmlText, 'text/html');

          const filas = doc.querySelectorAll('table tr');
          if (filas.length > 1) {
            const celdas = filas[1].querySelectorAll('td');
            if (celdas.length >= 6) {
              meter.deuda = `$${celdas[5].innerText.trim()} USD`;
              const mesesNum = celdas[6] ? celdas[6].innerText.trim() : "0";
              meter.meses = `${mesesNum} Mes${mesesNum !== "1" ? 'es' : ''}`;
            } else {
              // Si la tabla no tiene las celdas esperadas, probablemente los datos de consulta (criterio/valor) 
              // no son los correctos o el medidor no arrojó deuda.
              meter.deuda = "$0.00 USD"; meter.meses = "0 Meses";
            }
          } else {
            meter.deuda = "Sin Deuda / Al día"; meter.meses = "--";
          }
        } catch(e) {
          meter.deuda = "Error (Lectura)";
          meter.meses = "--";
        }
    }

    meter.isFetching = false;
    currentMeterIndex++;
    
    // Pausa de 2 segundos para dar respiro a los proxies públicos
    setTimeout(procesarSiguienteMedidorAsync, 2000);
  }

  function actualizarHeaderUI() {
    const activeMeter = state.find(m => m.id === activeMeterId);
    if (!activeMeter) return;
    
    const elMeses = document.getElementById('val-meses');
    const elDeuda = document.getElementById('val-deuda');
    
    elMeses.innerText = activeMeter.meses || '--';
    elDeuda.innerText = activeMeter.deuda || '--';
    
    if (activeMeter.isFetching) {
      elMeses.classList.add('updating');
      elDeuda.classList.add('updating');
    } else {
      elMeses.classList.remove('updating');
      elDeuda.classList.remove('updating');
    }
  }

  renderApp();
  
  window.addEventListener('load', () => {
    setTimeout(ejecutarConsultaEerssa, 600); 
  });

</script>

</body>
</html>
