<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus IA - Memoria Persistente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass-panel {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .pulse-mic {
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .markdown-body pre { background: #020617; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-top: 0.5rem; margin-bottom: 0.5rem; border: 1px solid rgba(255,255,255,0.1); }
        .markdown-body code { font-family: monospace; color: #5eead4; }
        .markdown-body p { margin-bottom: 0.5rem; }
        .markdown-body strong { color: #f8fafc; font-weight: 600; }
        #chat-area { transition: all 0.5s ease-in-out; }
    </style>
</head>
<body class="bg-gray-950 text-slate-200 font-sans h-screen w-full flex items-center justify-center p-3 md:p-4 overflow-hidden selection:bg-teal-500 selection:text-white" id="main-body">

    <div id="app-container" class="glass-panel w-full max-w-3xl rounded-[2rem] shadow-2xl shadow-teal-900/10 flex flex-col transition-all duration-700 ease-out h-[120px] max-h-[90vh]">
        
        <header id="app-header" class="px-5 py-4 flex justify-between items-center border-b border-white/5 shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-teal-500 to-blue-600 flex items-center justify-center shadow-lg" id="ai-icon-container">
                    <i class="fas fa-brain text-white text-lg" id="ai-icon"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-wide" id="app-title">Nexus AI <span class="text-[10px] bg-teal-500/20 text-teal-300 px-2 py-0.5 rounded-full ml-1 align-middle">Evolutiva</span></h1>
                    <p class="text-xs text-slate-400" id="app-status">Iniciando sistemas y memoria...</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button id="mute-btn" class="w-10 h-10 rounded-full hover:bg-white/10 flex items-center justify-center text-slate-300 transition-colors" title="Voz (Activa/Muda)">
                    <i class="fas fa-volume-up" id="mute-icon"></i>
                </button>
            </div>
        </header>

        <main id="chat-area" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 hidden flex-col scroll-smooth">
            <div class="flex justify-start opacity-50 hidden shrink-0" id="typing-indicator">
                <div class="bg-slate-800/80 border border-slate-700/50 rounded-2xl rounded-tl-none px-4 py-3 flex gap-1.5 items-center">
                    <div class="w-2 h-2 bg-teal-400 rounded-full animate-bounce" style="animation-delay: 0ms"></div>
                    <div class="w-2 h-2 bg-teal-400 rounded-full animate-bounce" style="animation-delay: 150ms"></div>
                    <div class="w-2 h-2 bg-teal-400 rounded-full animate-bounce" style="animation-delay: 300ms"></div>
                </div>
            </div>
        </main>

        <footer id="app-footer" class="p-3 md:p-4 bg-slate-900/60 rounded-b-[2rem] relative mt-auto border-t border-white/5 shrink-0">
            <div class="relative flex items-end gap-2">
                <textarea id="user-input" rows="1" class="flex-1 bg-slate-800/80 text-white rounded-2xl py-3 px-4 md:py-4 md:pl-5 resize-none focus:outline-none focus:ring-1 focus:ring-teal-500/50 shadow-inner transition-all overflow-hidden max-h-32 text-sm md:text-base" placeholder="Escribe tu orden o toca el micrófono..."></textarea>
                
                <button id="mic-btn" class="w-12 h-12 shrink-0 bg-teal-600 hover:bg-teal-500 text-white rounded-2xl flex items-center justify-center shadow-lg transition-transform transform active:scale-90 z-10 mb-0.5" title="Tocar para hablar">
                    <i class="fas fa-microphone text-xl pointer-events-none"></i>
                </button>
            </div>
            <p class="text-[10px] text-center text-slate-500 mt-2.5 px-2">Las modificaciones que me pidas ahora se guardarán para siempre en Firebase.</p>
        </footer>
    </div>

    <!-- TIPO MODULE PARA IMPORTAR FIREBASE -->
    <script type="module">
        // Importaciones de Firebase v11.6.1 (Compatible y modular)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // CONFIGURACIÓN DE FIREBASE (PROVISTA POR TI)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCROZ20n9v4WesAHLg-Ngk-wAsWg3IquaE",
            authDomain: "reproductor-de-musica-d9baf.firebaseapp.com",
            databaseURL: "https://reproductor-de-musica-d9baf-default-rtdb.firebaseio.com",
            projectId: "reproductor-de-musica-d9baf",
            storageBucket: "reproductor-de-musica-d9baf.firebasestorage.app",
            messagingSenderId: "154788397343",
            appId: "1:154788397343:web:f5164dfeac0d2bdae9302a",
            measurementId: "G-32JP5MDW64"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUser = null;

        // ==========================================
        // API KEY DE GEMINI 
        // ==========================================
        const apiKey = ""; 
        const userGeminiKey = "AQ.Ab8RN6KNIa1OmnCAUp-LlXOUHfIWhLuacpMK7kXzccoDCt77_Q";
        const finalApiKey = apiKey || userGeminiKey;
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${finalApiKey}`;

        // ==========================================
        // INSTRUCCIONES DEL SISTEMA
        // ==========================================
        const systemInstruction = `
        Eres Nexus, un asistente de IA súper inteligente, veloz y altamente profesional. 
        CAPACIDAD ESPECIAL: Eres AUTOMODIFICABLE de forma PERMANENTE.
        Las modificaciones que haces a tu interfaz (HTML/CSS vía JS) se guardan en Firebase y se ejecutan cada vez que el usuario te visita.
        
        REGLAS DE AUTOMODIFICACIÓN:
        1. Para modificar la interfaz, debes proveer un bloque EXACTAMENTE así:
        \`\`\`javascript
        // tu codigo dom aquí
        \`\`\`
        2. IMPORTANTE: Tu código se ejecutará en un entorno encapsulado. Para afectar la interfaz debes usar \`document.getElementById('ID_DEL_ELEMENTO')\`.
        3. IDs principales: 'app-container', 'chat-area', 'main-body', 'app-header', 'app-title', 'ai-icon-container', 'user-input', 'mic-btn'.
        4. Sé creativo. Si piden modo oscuro intenso, cambiar fuentes, cambiar colores de botones, hazlo con Tailwind (element.className) o element.style.
        5. SIEMPRE da una respuesta verbal breve. El código JS no se lee en voz alta.
        `;

        // ==========================================
        // ESTADO Y DOM
        // ==========================================
        let isMuted = false;
        let isRecording = false;
        let synth = window.speechSynthesis;
        let recognition = null;

        const appContainer = document.getElementById('app-container');
        const chatArea = document.getElementById('chat-area');
        const userInput = document.getElementById('user-input');
        const micBtn = document.getElementById('mic-btn');
        const muteBtn = document.getElementById('mute-btn');
        const muteIcon = document.getElementById('mute-icon');
        const typingIndicator = document.getElementById('typing-indicator');
        const appStatus = document.getElementById('app-status');

        // ==========================================
        // LÓGICA DE FIREBASE (PERSISTENCIA)
        // ==========================================
        async function initStorage() {
            try {
                // Autenticación anónima obligatoria para escribir en base de datos
                const userCred = await signInAnonymously(auth);
                currentUser = userCred.user;
                
                appStatus.innerText = "Conectando memorias...";
                await loadModifications();
                appStatus.innerText = "Conectado. Memoria activa.";
                
            } catch(e) {
                console.error("Error Auth Firebase:", e);
                appStatus.innerText = "Error: Habilita 'Anónimo' en Firebase Auth.";
                appStatus.classList.add('text-red-400');
                appendMessage('ai', "⚠️ **Error de Firebase:** No pude acceder a la base de datos. Ve a tu consola de Firebase > Authentication > Sign-in method > Y habilita el proveedor **Anónimo**.");
            }
        }

        async function loadModifications() {
            if (!currentUser) return;
            try {
                // Regla de ruta estricta
                const modsRef = collection(db, 'artifacts', 'nexus_ai', 'public', 'data', 'ui_modifications');
                const snapshot = await getDocs(modsRef);
                
                let mods = [];
                snapshot.forEach(doc => mods.push(doc.data()));
                
                // Ordenar cronológicamente en memoria
                mods.sort((a, b) => a.timestamp - b.timestamp);
                
                // Aplicar modificaciones guardadas
                mods.forEach(mod => {
                    try {
                        const modFunction = new Function(mod.code);
                        modFunction();
                    } catch(err) {
                        console.error("Fallo al cargar modificación antigua:", err);
                    }
                });
            } catch (error) {
                console.error("Error cargando modificaciones:", error);
            }
        }

        async function saveModification(codeString) {
            if (!currentUser) return;
            try {
                const modsRef = collection(db, 'artifacts', 'nexus_ai', 'public', 'data', 'ui_modifications');
                await addDoc(modsRef, {
                    code: codeString,
                    timestamp: Date.now()
                });
            } catch (error) {
                console.error("Error guardando modificación:", error);
            }
        }

        // ==========================================
        // VOZ Y MICRÓFONO
        // ==========================================
        if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isRecording = true;
                micBtn.classList.add('pulse-mic');
                micBtn.classList.replace('bg-teal-600', 'bg-red-500');
                micBtn.classList.replace('hover:bg-teal-500', 'hover:bg-red-400');
                userInput.placeholder = "Escuchando... Toca para detener.";
                synth.cancel(); 
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                stopRecordingVisuals();
                handleSend(); 
            };

            recognition.onerror = (event) => {
                console.error("Error micrófono:", event.error);
                stopRecordingVisuals();
                if (event.error === 'not-allowed') {
                    appendMessage('ai', "⚠️ **Micrófono denegado.** Recuerda subir a GitHub Pages o dar permiso en el navegador.");
                }
            };

            recognition.onend = () => stopRecordingVisuals();
        }

        const stopRecordingVisuals = () => {
            isRecording = false;
            micBtn.classList.remove('pulse-mic');
            micBtn.classList.replace('bg-red-500', 'bg-teal-600');
            micBtn.classList.replace('hover:bg-red-400', 'hover:bg-teal-500');
            userInput.placeholder = "Escribe tu orden o toca el micrófono...";
        };

        micBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (!recognition) {
                appendMessage('ai', "⚠️ Tu navegador no soporta voz."); return;
            }
            if (isRecording) recognition.stop(); 
            else {
                try { recognition.start(); } catch(err) {}
            }
        });

        muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            if (isMuted) {
                muteIcon.classList.replace('fa-volume-up', 'fa-volume-mute');
                muteIcon.classList.replace('text-slate-300', 'text-red-400');
                synth.cancel(); 
            } else {
                muteIcon.classList.replace('fa-volume-mute', 'fa-volume-up');
                muteIcon.classList.replace('text-red-400', 'text-slate-300');
            }
        });

        // ==========================================
        // TEXTO Y CHAT
        // ==========================================
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
        });

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 128) + 'px';
            if(this.value === '') this.style.height = 'auto';
        });

        function expandUI() {
            appContainer.style.height = '90vh';
            chatArea.classList.remove('hidden');
            setTimeout(() => { chatArea.classList.add('flex'); }, 50);
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            expandUI();
            appendMessage('user', text);
            userInput.value = '';
            userInput.style.height = 'auto';
            
            typingIndicator.classList.remove('hidden');
            chatArea.appendChild(typingIndicator); 
            chatArea.scrollTop = chatArea.scrollHeight;

            await fetchAIResponse(text);
        }

        async function fetchAIResponse(userText) {
            try {
                const payload = {
                    contents: [{ parts: [{ text: userText }] }],
                    systemInstruction: { parts: [{ text: systemInstruction }] }
                };

                let response = null;
                let delay = 1000;
                for (let i = 0; i < 3; i++) {
                    response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (response.ok) break;
                    await new Promise(r => setTimeout(r, delay));
                    delay *= 2;
                }

                if (!response || !response.ok) throw new Error("Fallo de conexión API.");

                const data = await response.json();
                const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Error interno.";
                
                typingIndicator.classList.add('hidden');
                processAIResponse(aiText);

            } catch (error) {
                typingIndicator.classList.add('hidden');
                appendMessage('ai', "🚨 **Error:** " + error.message);
            }
        }

        function processAIResponse(fullText) {
            const jsRegex = /```javascript\n([\s\S]*?)```/gi;
            let codeBlocks = [];
            let match;
            
            while ((match = jsRegex.exec(fullText)) !== null) {
                codeBlocks.push(match[1]);
            }

            let cleanText = fullText.replace(/```javascript\n[\s\S]*?```/gi, '').trim();
            appendMessage('ai', parseMarkdown(fullText));

            if (!isMuted && cleanText) speakText(cleanText);

            if (codeBlocks.length > 0) {
                setTimeout(() => {
                    codeBlocks.forEach(code => {
                        try {
                            const modFunction = new Function(code);
                            modFunction();
                            // ¡GUARDAMOS LA MODIFICACIÓN EN FIREBASE!
                            saveModification(code);
                        } catch (err) {
                            console.error("Error Automodificando:", err);
                        }
                    });
                }, 600);
            }
        }

        function speakText(text) {
            if(isMuted) return;
            synth.cancel();
            
            const textToSpeak = text.replace(/[*_#`]/g, '').trim();
            if(!textToSpeak) return;

            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = 'es-ES';
            utterance.rate = 1.15; 
            
            const voices = synth.getVoices();
            const esVoice = voices.find(v => v.lang.includes('es') && (v.name.includes('Google') || v.name.includes('Natural')));
            if(esVoice) utterance.voice = esVoice;

            synth.speak(utterance);
        }

        function appendMessage(role, htmlContent) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} animate-fade-in w-full`;
            
            const innerDiv = document.createElement('div');
            innerDiv.className = `max-w-[90%] md:max-w-[80%] rounded-2xl px-4 py-3 shadow-md markdown-body break-words text-[15px] ${
                role === 'user' 
                ? 'bg-teal-600/90 text-white rounded-br-none ml-auto' 
                : 'bg-slate-800/90 border border-slate-700/50 text-slate-200 rounded-tl-none mr-auto'
            }`;
            
            innerDiv.innerHTML = htmlContent;
            msgDiv.appendChild(innerDiv);
            
            chatArea.insertBefore(msgDiv, typingIndicator);
            setTimeout(() => { chatArea.scrollTop = chatArea.scrollHeight; }, 50);
        }

        function parseMarkdown(text) {
            return text
                .replace(/```(.*?)\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code class="bg-slate-900 px-1 rounded text-teal-300 text-sm">$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\*([^*]+)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br>');
        }

        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        `;
        document.head.appendChild(style);

        // Iniciar conexión con Firebase al cargar la página
        initStorage();

    </script>
</body>
</html>
