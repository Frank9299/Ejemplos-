<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creador de Interfaces con Gemini IA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: vertical;
            box-sizing: border-box;
            font-size: 14px;
        }
        button.action-btn {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            width: 100%;
        }
        button.action-btn:hover {
            background-color: #4338ca;
        }
        #area-dinamica {
            margin-top: 20px;
            padding: 15px;
            border: 2px dashed #e5e7eb;
            border-radius: 5px;
            min-height: 150px;
            background: #fafafa;
        }
        .loading {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Interfaz Modificada por IA</h2>
    <p>Escribe qué deseas agregar, cambiar o crear en la página:</p>
    
    <textarea id="promptInput" placeholder="Ej: Crea un botón verde que diga Comprar..."></textarea>
    <button class="action-btn" onclick="enviarPrompt()">Ejecutar con IA</button>

    <h3>Resultado en vivo:</h3>
    <div id="area-dinamica">
        <p style="color: #9ca3af; margin: 0;">Los elementos que crees con la IA aparecerán aquí...</p>
    </div>
</div>

<script>
    const API_KEY = "AIzaSyDqJ_429yDxNWwHCT5mGO1XV9Fw-MyxOwg";

    async function enviarPrompt() {
        const promptText = document.getElementById("promptInput").value.trim();
        const areaDinamica = document.getElementById("area-dinamica");

        if (!promptText) {
            alert("Por favor escribe una instrucción.");
            return;
        }

        areaDinamica.innerHTML = '<p class="loading">Pensando y generando código...</p>';

        const systemInstruction = "Eres un generador de código web experto. Devuelve EXCLUSIVAMENTE código HTML y JavaScript válido que pueda insertarse directamente dentro de un contenedor DOM. No uses bloques de Markdown (como ```html), solo devuelve los elementos funcionales requeridos.";

        // Usamos el modelo gemini-1.5-flash y la estructura estándar de Google AI Studio
        const url = `[https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$](https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$){API_KEY}`;

        try {
            const response = await fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    contents: [
                        {
                            parts: [
                                { text: systemInstruction + "\n\nPetición del usuario: " + promptText }
                            ]
                        }
                    ]
                })
            });

            const data = await response.json();

            if (data.candidates && data.candidates[0].content.parts[0].text) {
                let htmlRespuesta = data.candidates[0].content.parts[0].text;
                
                htmlRespuesta = htmlRespuesta.replace(/```html/g, '').replace(/```javascript/g, '').replace(/```/g, '').trim();

                areaDinamica.innerHTML = htmlRespuesta;

                const scripts = areaDinamica.querySelectorAll("script");
                scripts.forEach(script => {
                    const nuevoScript = document.createElement("script");
                    nuevoScript.textContent = script.textContent;
                    document.body.appendChild(nuevoScript);
                    script.remove();
                });

            } else if (data.error) {
                areaDinamica.innerHTML = `<p style="color: red;">Error de API: ${data.error.message}</p>`;
            } else {
                areaDinamica.innerHTML = '<p style="color: red;">Error: La IA no devolvió una respuesta válida.</p>';
            }

        } catch (error) {
            console.error(error);
            areaDinamica.innerHTML = '<p style="color: red;">Error de conexión con la API de Google.</p>';
        }
    }
</script>

</body>
</html>
